name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=. python -m pytest -q
      - run: python ../scripts/smoke_backend.py
  frontend-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  frontend-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BACKEND_API_KEY: ci-only-not-production
      APP_USERNAME: ci-user
      APP_PASSWORD: ci-password-not-production
      SESSION_SECRET: ci-only-secret-long-enough-for-tests-not-production
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r backend/requirements.txt -r scripts/browser_requirements.txt
      - name: Full-stack HTTP integration
        run: python scripts/smoke_fullstack.py
      - name: Install browser engines
        run: python -m playwright install --with-deps chromium webkit
      - name: Desktop and mobile browser workflows over HTTPS
        run: python scripts/smoke_browser.py
      - name: Save synthetic browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: browser-artifacts/
          retention-days: 7
          if-no-files-found: ignore
  preview-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build disposable preview image without publishing
        run: docker build -t awa-preview:ci .
      - name: Test protected preview image on loopback
        run: python scripts/smoke_container.py
